<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M FOUR STUDIOS</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif;text-align:center}header{padding:28px 12px}.logo{font-size:clamp(30px,8vw,58px);font-weight:900;letter-spacing:.12em;text-shadow:3px 3px #520909}.sub{font-size:11px;letter-spacing:.3em;color:#aaa}main{width:min(1000px,94%);margin:auto;background:#151515;border:1px solid #444;padding:14px}.stage{position:relative;background:#000;aspect-ratio:4/3;overflow:hidden}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#n{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:900;text-shadow:0 4px 20px #000}#f{position:absolute;inset:0;background:#fff;opacity:0}.buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}button,select{padding:12px 15px;background:#111;color:#fff;border:1px solid #777;font-weight:bold}.red{background:#650d0d;border-color:#b44}.status{color:#aaa;font-size:12px;margin:12px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:#101010;padding:6px}.card img{width:100%}.card button{width:100%;margin-top:5px;padding:8px}footer{padding:20px;color:#666;font-size:11px;letter-spacing:.2em}</style></head><body><header><div class="logo">M FOUR STUDIOS</div><div class="sub">DARK ROOM • PHOTOBOOTH</div></header><main><div class="stage"><video id="v" autoplay playsinline muted></video><div id="n"></div><div id="f"></div></div><div class="buttons"><select id="filter"><option value="none">NORMAL</option><option value="contrast">CONTRAST</option><option value="red">RED NOIR</option><option value="bw">BLACK & WHITE</option><option value="cinema">CINEMATIC</option></select><button id="start" class="red">START CAMERA</button><button id="shot">TAKE PHOTO</button></div><div id="s" class="status">Tekan START CAMERA untuk mulai.</div><div id="g" class="gallery"></div></main><canvas id="c" hidden></canvas><footer>M FOUR STUDIOS — ENTER • POSE • CAPTURE</footer><script>const v=document.querySelector('#v'),c=document.querySelector('#c'),x=c.getContext('2d'),n=document.querySelector('#n'),f=document.querySelector('#f'),g=document.querySelector('#g'),s=document.querySelector('#s'),sel=document.querySelector('#filter');let st,last;const fs={none:'none',contrast:'contrast(1.25) saturate(1.15)',red:'contrast(1.3) sepia(.25) hue-rotate(315deg) saturate(1.8)',bw:'grayscale(1) contrast(1.2)',cinema:'contrast(1.22) saturate(.8) sepia(.12)'};sel.onchange=()=>v.style.filter=fs[sel.value];async function cam(){try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});v.srcObject=st;s.textContent='Kamera aktif. Siap berpose.'}catch(e){s.textContent='Kamera ditolak/tidak tersedia. Pastikan situs dibuka melalui HTTPS dan izin kamera aktif.'}}function wait(){return new Promise(r=>{let q=3;n.textContent=q;let t=setInterval(()=>{q--;if(q)n.textContent=q;else{clearInterval(t);n.textContent='';r()}},700)})}async function take(){if(!st){await cam();if(!st)return}await wait();c.width=v.videoWidth||1280;c.height=v.videoHeight||960;x.save();x.translate(c.width,0);x.scale(-1,1);x.filter=fs[sel.value];x.drawImage(v,0,0,c.width,c.height);x.restore();x.filter='none';x.fillStyle='rgba(0,0,0,.42)';x.fillRect(0,c.height-75,c.width,75);x.fillStyle='#fff';x.font='bold 24px Arial';x.fillText('M FOUR STUDIOS',25,c.height-40);x.font='12px Arial';x.fillStyle='#bbb';x.fillText(new Date().toLocaleString('id-ID'),27,c.height-18);last=c.toDataURL('image/jpeg',.94);f.style.opacity=1;setTimeout(()=>f.style.opacity=0,120);let d=document.createElement('div');d.className='card';d.innerHTML='<img src="'+last+'"><button>DOWNLOAD</button>';d.querySelector('button').onclick=()=>{let a=document.createElement('a');a.href=last;a.download='M-FOUR-STUDIOS-'+Date.now()+'.jpg';a.click()};g.prepend(d);s.textContent='Foto berhasil diambil.'}document.querySelector('#start').onclick=cam;document.querySelector('#shot').onclick=take;</script></body></html>
