<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M FOUR STUDIOS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif;text-align:center}
header{padding:28px 12px}
.logo{font-size:clamp(30px,8vw,58px);font-weight:900;letter-spacing:.12em;text-shadow:3px 3px #520909}
.sub{font-size:11px;letter-spacing:.3em;color:#aaa}
main{width:min(1000px,94%);margin:auto;background:#151515;border:1px solid #444;padding:14px}
.stage{position:relative;background:#000;aspect-ratio:4/3;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#count{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(70px,18vw,150px);font-weight:900;text-shadow:0 4px 20px #000;z-index:4}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
#framePreview{position:absolute;inset:0;pointer-events:none;z-index:5}
.buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
button,select{padding:12px 15px;background:#111;color:#fff;border:1px solid #777;font-weight:bold}
.red{background:#650d0d;border-color:#b44}
.status{color:#aaa;font-size:12px;margin:12px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:#101010;padding:6px;border:1px solid #333}
.card img{width:100%;display:block}
.card button{width:100%;margin-top:5px;padding:8px}
footer{padding:20px;color:#666;font-size:11px;letter-spacing:.2em}

/* frame preview styles */
.frame-classic{border:8px solid #fff;box-shadow:inset 0 0 0 3px #111}
.frame-red{border:12px solid #8b1010;box-shadow:inset 0 0 0 3px #d8b4b4}
.frame-neon{border:4px solid #fff;box-shadow:inset 0 0 0 4px #111,inset 0 0 18px 5px #fff}
.frame-film{border:18px solid #111;box-shadow:inset 0 0 0 2px #777}
.frame-corners{border:4px solid #fff;box-shadow:inset 0 0 0 2px #111}
@media(max-width:600px){
 .buttons button,.buttons select{flex:1;min-width:42%}
}
</style>
</head>
<body>
<header>
<div class="logo">M FOUR STUDIOS</div>
<div class="sub">DARK ROOM • PHOTOBOOTH</div>
</header>

<main>
<div class="stage">
<video id="video" autoplay playsinline muted></video>
<div id="count"></div>
<div id="framePreview"></div>
<div id="flash"></div>
</div>

<div class="buttons">
<select id="filter" aria-label="Filter">
<option value="none">FILTER: NORMAL</option>
<option value="contrast">FILTER: CONTRAST</option>
<option value="red">FILTER: RED NOIR</option>
<option value="bw">FILTER: BLACK & WHITE</option>
<option value="cinema">FILTER: CINEMATIC</option>
<option value="warm">FILTER: WARM</option>
</select>

<select id="frame" aria-label="Frame">
<option value="none">FRAME: TANPA</option>
<option value="classic">FRAME: CLASSIC</option>
<option value="red">FRAME: RED</option>
<option value="neon">FRAME: NEON</option>
<option value="film">FRAME: FILM</option>
<option value="corners">FRAME: CORNERS</option>
</select>

<button id="start" class="red">START CAMERA</button>
<button id="shot">TAKE PHOTO</button>
</div>

<div id="status" class="status">Tekan START CAMERA untuk mulai.</div>
<div id="gallery" class="gallery"></div>
</main>

<canvas id="canvas" hidden></canvas>
<footer>M FOUR STUDIOS — ENTER • POSE • CAPTURE</footer>

<script>
const video=document.querySelector('#video');
const canvas=document.querySelector('#canvas');
const ctx=canvas.getContext('2d');
const count=document.querySelector('#count');
const flash=document.querySelector('#flash');
const gallery=document.querySelector('#gallery');
const status=document.querySelector('#status');
const filter=document.querySelector('#filter');
const frame=document.querySelector('#frame');
const framePreview=document.querySelector('#framePreview');

let stream=null,lastData=null;

const filters={
none:'none',
contrast:'contrast(1.25) saturate(1.15)',
red:'contrast(1.3) sepia(.25) hue-rotate(315deg) saturate(1.8)',
bw:'grayscale(1) contrast(1.2)',
cinema:'contrast(1.22) saturate(.8) sepia(.12)',
warm:'sepia(.22) saturate(1.35) contrast(1.05)'
};

const frameClasses={
none:'',
classic:'frame-classic',
red:'frame-red',
neon:'frame-neon',
film:'frame-film',
corners:'frame-corners'
};

filter.onchange=()=>video.style.filter=filters[filter.value];

frame.onchange=()=>{
framePreview.className=frameClasses[frame.value];
};

async function startCamera(){
try{
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},
audio:false
});
video.srcObject=stream;
status.textContent='Kamera aktif. Siap berpose.';
}catch(e){
status.textContent='Kamera tidak bisa diakses. Izinkan kamera pada browser.';
}
}

function countdown(){
return new Promise(resolve=>{
let q=3;
count.textContent=q;
const t=setInterval(()=>{
q--;
if(q>0) count.textContent=q;
else{
clearInterval(t);
count.textContent='';
resolve();
}
},700);
});
}

function drawFrame(type,w,h){
ctx.save();
ctx.lineWidth=Math.max(8,w*0.018);
if(type==='classic'){
ctx.strokeStyle='#fff';ctx.strokeRect(8,8,w-16,h-16);
ctx.lineWidth=3;ctx.strokeStyle='#111';ctx.strokeRect(15,15,w-30,h-30);
}
if(type==='red'){
ctx.strokeStyle='#8b1010';ctx.lineWidth=Math.max(14,w*0.025);ctx.strokeRect(8,8,w-16,h-16);
ctx.lineWidth=3;ctx.strokeStyle='#e2c0c0';ctx.strokeRect(22,22,w-44,h-44);
}
if(type==='neon'){
ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.strokeRect(5,5,w-10,h-10);
ctx.lineWidth=4;ctx.strokeStyle='#111';ctx.strokeRect(13,13,w-26,h-26);
}
if(type==='film'){
ctx.fillStyle='#111';
ctx.fillRect(0,0,w,Math.max(22,h*.045));
ctx.fillRect(0,h-Math.max(22,h*.045),w,Math.max(22,h*.045));
ctx.strokeStyle='#777';ctx.lineWidth=2;ctx.strokeRect(12,12,w-24,h-24);
}
if(type==='corners'){
ctx.strokeStyle='#fff';ctx.lineWidth=5;
const l=Math.min(w,h)*.09;
ctx.beginPath();
ctx.moveTo(10,l);ctx.lineTo(10,10);ctx.lineTo(l,10);
ctx.moveTo(w-l,10);ctx.lineTo(w-10,10);ctx.lineTo(w-10,l);
ctx.moveTo(10,h-l);ctx.lineTo(10,h-10);ctx.lineTo(l,h-10);
ctx.moveTo(w-l,h-10);ctx.lineTo(w-10,h-10);ctx.lineTo(w-10,h-l);
ctx.stroke();
}
ctx.restore();
}

async function take(){
if(!stream){await startCamera();if(!stream)return}
await countdown();

canvas.width=video.videoWidth||1280;
canvas.height=video.videoHeight||960;

ctx.save();
ctx.translate(canvas.width,0);
ctx.scale(-1,1);
ctx.filter=filters[filter.value];
ctx.drawImage(video,0,0,canvas.width,canvas.height);
ctx.restore();
ctx.filter='none';

drawFrame(frame.value,canvas.width,canvas.height);

ctx.fillStyle='rgba(0,0,0,.42)';
ctx.fillRect(0,canvas.height-78,canvas.width,78);

ctx.fillStyle='#fff';
ctx.font='bold 25px Arial';
ctx.fillText('M FOUR STUDIOS',28,canvas.height-42);

ctx.font='12px Arial';
ctx.fillStyle='#bbb';
ctx.fillText(new Date().toLocaleString('id-ID'),30,canvas.height-18);

flash.style.opacity=1;
setTimeout(()=>flash.style.opacity=0,120);

lastData=canvas.toDataURL('image/jpeg',.94);

const card=document.createElement('div');
card.className='card';

const img=document.createElement('img');
img.src=lastData;
card.appendChild(img);

const b=document.createElement('button');
b.textContent='DOWNLOAD';
b.onclick=()=>{
const a=document.createElement('a');
a.href=lastData;
a.download='M-FOUR-STUDIOS-'+Date.now()+'.jpg';
a.click();
};
card.appendChild(b);

gallery.prepend(card);
status.textContent='Foto berhasil diambil.';
}

document.querySelector('#start').onclick=startCamera;
document.querySelector('#shot').onclick=take;
</script>
</body>
</html>
